<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>54 moments of love</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Dancing+Script:wght@500;600;700&display=swap');
        
        :root {
            --pink-bg: #fce4ec;
            --dark-pink: #b23a62;
            --dark: #333;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 30px 20px;
            background:
                radial-gradient(circle at 15% 15%, rgba(255,255,255,.7) 0 2px, transparent 3px),
                radial-gradient(circle at 85% 25%, rgba(255,255,255,.55) 0 2px, transparent 3px),
                linear-gradient(135deg, #fce4ec, #f8d5e0);
            background-size: 90px 90px, 120px 120px, cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--dark-pink);
            text-align: center;
            font-size: 2.5rem;
            margin: 0 0 35px;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 2px 0 rgba(255,255,255,.7);
        }

        .hearts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 55px 28px;
            max-width: 980px;
            width: 100%;
            padding: 20px;
        }

        .envelope {
            position: relative;
            height: 125px;
            background: linear-gradient(145deg, #fff, #f8f8f8);
            border: 1px solid rgba(190, 130, 150, .25);
            border-radius: 7px;
            cursor: pointer;
            box-shadow:
                0 12px 20px rgba(130, 70, 90, .14),
                0 2px 0 rgba(255,255,255,.9) inset;
            transition: transform .35s ease, box-shadow .35s ease;
            isolation: isolate;
        }

        .envelope:hover {
            transform: translateY(-9px) rotate(.5deg);
            box-shadow:
                0 20px 30px rgba(130, 70, 90, .22),
                0 2px 0 rgba(255,255,255,.9) inset;
        }

        .envelope::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 49.5%, #e8e8e8 50%, transparent 50.5%);
            clip-path: polygon(0 0, 100% 0, 50% 58%);
            z-index: 3;
            pointer-events: none;
        }

        .envelope::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(35deg, transparent 49.5%, #ededed 50%, transparent 50.8%),
                linear-gradient(-35deg, transparent 49.5%, #ededed 50%, transparent 50.8%);
            clip-path: polygon(0 100%, 50% 48%, 100% 100%);
            z-index: 2;
            pointer-events: none;
        }

        .envelope-flap {
            position: absolute;
            top: -1px;
            left: 50%;
            width: 0;
            height: 0;
            transform: translateX(-50%);
            border-left: 84px solid transparent;
            border-right: 84px solid transparent;
            border-top: 67px solid #e9e9e9;
            filter: drop-shadow(0 2px 1px rgba(0,0,0,.08));
            z-index: 4;
            pointer-events: none;
        }

        .envelope-flap::after {
            content: "";
            position: absolute;
            top: -66px;
            left: -78px;
            border-left: 78px solid transparent;
            border-right: 78px solid transparent;
            border-top: 61px solid rgba(255,255,255,.45);
        }

        .heart-seal {
            position: absolute;
            width: 54px;
            height: 54px;
            left: 50%;
            top: 52%;
            transform: translate(-50%, -35%) rotate(-45deg);
            background: #e85d75;
            border-radius: 5px;
            z-index: 10;
            box-shadow:
                0 5px 8px rgba(120, 35, 60, .25),
                0 1px 0 rgba(255,255,255,.35) inset;
            transition: transform .35s ease, filter .35s ease;
        }

        .heart-seal::before,
        .heart-seal::after {
            content: "";
            position: absolute;
            width: 54px;
            height: 54px;
            background: inherit;
            border-radius: 50%;
        }

        .heart-seal::before {
            top: -27px;
            left: 0;
        }

        .heart-seal::after {
            top: 0;
            left: 27px;
        }

        .heart-number {
            position: absolute;
            z-index: 20;
            left: 50%;
            top: 52%;
            transform: translate(-50%, -48%);
            color: white;
            font-family: 'Dancing Script', cursive;
            font-size: 25px;
            font-weight: 700;
            text-shadow: 0 1px 2px rgba(100, 20, 40, .3);
            pointer-events: none;
        }

        .envelope:hover .heart-seal {
            transform: translate(-50%, -35%) rotate(-45deg) scale(1.1);
            filter: brightness(1.08);
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(70, 35, 45, .5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: linear-gradient(135deg, rgba(255,255,255,.98), rgba(255,247,250,.98));
            padding: 48px 35px 38px;
            border-radius: 20px;
            max-width: 560px;
            width: 100%;
            text-align: center;
            color: var(--dark);
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,.25);
            border: 1px solid #f2d5dd;
            animation: modalIn .3s ease;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(.92) translateY(15px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .close-btn {
            position: absolute;
            top: 10px;
            left: 18px;
            font-size: 2rem;
            color: #c85b78;
            cursor: pointer;
            line-height: 1;
            transition: transform .2s ease, color .2s ease;
        }

        .close-btn:hover {
            color: #a83d5d;
            transform: rotate(90deg);
        }

        .reason-text {
            font-size: 1.25rem;
            line-height: 1.9;
            color: #4a4a4a;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 12px;
            }
            h1 {
                font-size: 2rem;
                margin-bottom: 25px;
            }
            .hearts-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 48px 18px;
                padding: 10px;
            }
            .envelope {
                height: 105px;
            }
            .envelope-flap {
                border-top-width: 57px;
            }
            .heart-seal {
                width: 46px;
                height: 46px;
            }
            .heart-seal::before,
            .heart-seal::after {
                width: 46px;
                height: 46px;
            }
            .heart-seal::before {
                top: -23px;
            }
            .heart-seal::after {
                left: 23px;
            }
            .heart-number {
                font-size: 22px;
            }
            .reason-text {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <h1>The 54 moments of love</h1>
    
    <div class="hearts-grid" id="heartsGrid"></div>

    <div class="modal" id="reasonModal">
        <div class="modal-content">
            <span class="close-btn" id="closeBtn">&times;</span>
            <div class="reason-text" id="reasonText"></div>
        </div>
    </div>

    <script>
        const reasons = [
            "لما حسيت بخوفك علي وأنا تعبانة في المستشفى البحري.",
            "لما بتضعف قدامي وأنا بعيط.",
            "لما جبتلي التليفون 😉.",
            "لما بتديني فلوس من غير سبب🤑.",
            "لما بشوف حنيتك على ملك.",
            "لما استنتني وأنا نازلة من السلايد في الأكوا بارك وكان ممكن تبقى فرصة اغرق وتخلص منى.",
            "لما سافرنا مطروح.",
            "لما أصريت أشتري الخاتم الألماس.",
            "لما بتاكل اكله عملتها ونت مبسوط.",
            "لما بيعجبك ذوقى وتشكر فيه قدام الناس.",
            "لما كنت بتجيبلي الكوكاكولا مع الأكل في شهر العسل.",
            "لما جبت بالونات وأنا بولد ملك.",
            "لما جيتلي البيت عند ماما قبل الخطوبة بلبس الشغل عشان كنا متخانقين وكنت نايمة ومش برد على التليفون.",
            "لما كنا بنتعرف في النادي وقلتلي حبيبتي أنتِ تعملي اللي أنتِ عايزاه لما سألتك هتقعد تخنقني في النزول بعد الخطوبة.",
            "لما جبتلي الجيبة الأبيض والتوب المشجر في شهر العسل.",
            "لما بصيتلي في الفيرست لوك في يوم فرحنا.",
            "لما باخدك في حضني.",
            "لما بحسك مبسوط في السكس معايا مش بتجامل.",
            "لما بتجيبهم بسرعة 😍.",
            "في كل مرة كنت بتراقب عيني بتيجي على أي حاجه عشان تجيبهالي.",
            "لما سافرنا الغردقة لوحدنا لأول مرة من غير ملك.",
            "لما بعضّ راسك وحواجبك 🤪.",
            "لما بتجيبلي هدية غالية من غير ما تتردد.",
            "كل مرة بجري عليك فيها عشان عندي مشكلة.",
            "يوم ما قعدنا في البرجولة على البحر اللي في مرسى مطروح كنت حاساها الجنة.",
            "وأنا معاك في الـ lazy river.",
            "وإحنا في خانيا في اوضة الفندق اللي فيها بيسين.",
            "لما بكلمك واحنا في عز خناقنا عشان ببقى واحشني صوتك حتى لو هتزعق.",
            "لما بقعد أاكلك الآيس كريم اللي بتحبه.",
            "لما بتساعدني قبل وصول الضيوف وتفرش السفرة.",
            "لما بتصلي بحبك قوي.",
            "لما اكتشفت إنك لسه سايب الفيس آي دي بتاعي على تليفونك.",
            "بحبك عشان جواك حد طيب.",
            "بحبك عشان ضحكتك حلوة.",
            "بحبك عشان طويل.",
            "بحبك في الجينز قوي 😉.",
            "بحبك وأنت مسحول في شغلك.",
            "بحب حياتي معاك.",
            "بحب خوفك علينا.",
            "بحبك وأنت بتعتذر بعد وصلات غلط.",
            "بحب كل لحظة نجاح عدينا بيها مع بعض.",
            "أكتر لحظة حسيت قد إيه بحبك هي اللحظة التي حسيت إني ممكن ما أكونش في حياتك تاني.",
            "حبيت معاك فكرة إني مرات الكبير.",
            "بحب صوابع رجلك الطويلة.",
            "بحب لون عينيك.",
            "بحب إحساس الأمان وأنت معايا.",
            "بحب ثقتك في نفسك.",
            "بحب تدقيقك في شغلك.",
            "بحب لما مش بيهون عليك زعلي.",
            "بحبك لما بتعاملني زي بنتك.",
            "بحب خرم طيزك الضيق.",
            "بحب لمستك لظهرى.",
            "ونا نايمة على صدرك بعد السكس.",
            "كل مره ببصلك فيها بعد ما ربنا نجاك بكتشف اني بحبك فوق ما كنت متخيلة وان بجد هموت لو جرالك حاجة يا حبيبي."
        ];

        const heartColors = [
            "#e85d75", "#d94f70", "#c95b8e", "#e89aaa", 
            "#b85c8e", "#d66b83", "#c94f65", "#e37c9a", 
            "#a95c7a", "#df6682", "#c65a78", "#e48aa3"
        ];

        const grid = document.getElementById("heartsGrid");
        const modal = document.getElementById("reasonModal");
        const modalText = document.getElementById("reasonText");
        const closeBtn = document.getElementById("closeBtn");

        reasons.forEach((reason, i) => {
            const envelope = document.createElement("div");
            envelope.className = "envelope";
            envelope.setAttribute("role", "button");
            envelope.setAttribute("tabindex", "0");
            envelope.setAttribute("aria-label", `السبب رقم ${i + 1}`);

            const flap = document.createElement("div");
            flap.className = "envelope-flap";

            const heart = document.createElement("div");
            heart.className = "heart-seal";
            heart.style.background = heartColors[i % heartColors.length];

            const number = document.createElement("div");
            number.className = "heart-number";
            number.textContent = i + 1;

            envelope.appendChild(flap);
            envelope.appendChild(heart);
            envelope.appendChild(number);

            const openReason = () => {
                modalText.textContent = reason;
                modal.style.display = "flex";
                closeBtn.focus();
            };

            envelope.addEventListener("click", openReason);
            envelope.addEventListener("keydown", event => {
                if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();
                    openReason();
                }
            });

            grid.appendChild(envelope);
        });

        const closeModal = () => {
            modal.style.display = "none";
        };

        closeBtn.addEventListener("click", closeModal);

        window.addEventListener("click", event => {
            if (event.target === modal) {
                closeModal();
            }
        });

        window.addEventListener("keydown", event => {
            if (event.key === "Escape" && modal.style.display === "flex") {
                closeModal();
            }
        });
    </script>
</body>
</html>
